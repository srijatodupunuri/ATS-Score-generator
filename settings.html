<!doctype html>
<html>
  <head>
    <title>Settings</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body>
    <div class="dashboard-layout">
      <aside class="sidebar">
        <div class="sidebar-logo">ATS Recruit</div>
        <ul class="sidebar-menu">
          <li onclick="window.location = '/dashboard'">🏠 Dashboard</li>

          <li onclick="window.location = '/job-descriptions'">
            📄 Job Descriptions
          </li>

          <li onclick="window.location = '/resume-screening'">
            📂 Resume Screening
          </li>

          <li onclick="window.location = '/candidate-ranking'">
            ⭐ Candidate Ranking
          </li>

          <li onclick="window.location = '/candidate-profiles'">
            👥 Candidate Profiles
          </li>

          <li onclick="window.location = '/review-required'">
            ⚠ Review Required
          </li>

          <li onclick="window.location = '/analytics'">📊 Analytics</li>

          <li onclick="window.location = '/ai-insights'">🤖 AI Insights</li>

          <li class="active-menu" onclick="window.location = '/settings'">
            ⚙ Settings
          </li>
        </ul>
      </aside>

      <main class="dashboard-content">
        <h1>⚙ ATS Settings</h1>

        <div class="glass-card settings-card">
          <label> Recruiter Name </label>

          <input type="text" value="HR Admin" />

          <br /><br />

          <label> Auto Accept Threshold </label>

          <input type="number" value="70" />

          <br /><br />

          <label> Review Threshold </label>

          <input type="number" value="50" />

          <br /><br />

          <button>Save Settings</button>
        </div>
      </main>
    </div>
  </body>
  <script src="{{ url_for('static', filename='js/settings.js') }}"></script>
</html>
