<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATS Recruitment Assistant</title>
  </head>
  <body>
    <div class="blur-circle circle1"></div>
    <div class="blur-circle circle2"></div>
    <nav>
      <div class="logo">ATS Recruit</div>

      <ul>
        <li><a href="/" class="nav-btn">Home</a></li>

        <li><a href="/analysis" class="nav-btn">Analysis</a></li>

        <li><a href="/dashboard" class="nav-btn">Dashboard</a></li>

        <li><a href="/reports" class="nav-btn">Reports</a></li>

        <li><a href="/about" class="nav-btn">About</a></li>
      </ul>
      <a href="/login" class="nav-btn">HR Login</a>
    </nav>
    <div class="dashboard-content">
      <h1>📊 ATS Reports Center</h1>
      <input
        id="reportSearch"
        class="search-box"
        placeholder="Search Candidate..."
      />
      <div class="metrics-grid">
        <div class="metric-card">
          <h3>Total Reports</h3>

          <h1 id="totalReports">0</h1>
        </div>

        <div class="metric-card">
          <h3>Accepted</h3>

          <h1 id="acceptedReports">0</h1>
        </div>

        <div class="metric-card">
          <h3>Rejected</h3>

          <h1 id="rejectedReports">0</h1>
        </div>

        <div class="metric-card">
          <h3>Review Required</h3>

          <h1 id="reviewReports">0</h1>
        </div>
      </div>

      <div class="report-tabs">
        <button id="acceptedTab" class="report-tab" onclick="showAccepted()">
          ✅ Accepted
        </button>

        <button id="rejectedTab" class="report-tab" onclick="showRejected()">
          ❌ Rejected
        </button>

        <button id="reviewTab" class="report-tab" onclick="showReview()">
          ⚠ Review
        </button>

        <button id="historyTab" class="report-tab" onclick="showHistory()">
          📜 History
        </button>
      </div>
      <div class="reports-toolbar">
        <a href="/api/download/accepted" class="download-btn accepted-btn">
          📄 Download Accepted
        </a>

        <a href="/api/download/rejected" class="download-btn rejected-btn">
          📄 Download Rejected
        </a>

        <a href="/api/download/review" class="download-btn review-btn">
          📄 Download Review
        </a>
      </div>
      <div id="reportContent"></div>
    </div>

    <script src="{{ url_for('static', filename='js/jd.js') }}"></script>
    <script src="{{ url_for('static', filename='js/resume.js') }}"></script>
    <script src="{{ url_for('static', filename='js/analyze.js') }}"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
    <script src="{{ url_for('static', filename='js/reports.js') }}"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  </body>
</html>
